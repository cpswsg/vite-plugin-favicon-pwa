name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm
        # Run the upgrade through npx so the npm doing the install lives outside
        # the global prefix. Node 22 bundles npm 10.9.7, whose arborist lazily
        # requires promise-retry while linking bins - after it has already
        # replaced itself on disk with npm 12, which dropped that dependency.
        run: npx --yes npm@12.0.2 install --global npm@12.0.2

      - name: Verify release version
        run: node scripts/verify-release-tag.mjs

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        run: npm publish
        env:
          # Used to bootstrap 1.0.0. Once npm trusted publishing is configured,
          # npm prefers OIDC and this secret can be removed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
