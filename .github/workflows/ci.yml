name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24', '26']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up npm
        # Run the upgrade through npx so the npm doing the install lives outside
        # the global prefix. Node 22 bundles npm 10.9.7, whose arborist lazily
        # requires promise-retry while linking bins - after it has already
        # replaced itself on disk with npm 12, which dropped that dependency.
        run: npx --yes npm@12.0.2 install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test packed package
        if: matrix.node == '22.22.2'
        run: npm run test:package

  windows:
    name: Windows Node 22
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up npm
        # See the note on the same step in the `test` job.
        run: npx --yes npm@12.0.2 install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run lint && npm run typecheck && npm test && npm run build
